server {
    listen 80;
    listen [::]:80;

    server_name sonarqube.platform.bettrhq.com www.sonarqube.platform.bettrhq.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sonarqube.platform.bettrhq.com$request_uri;
    }
}

server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name sonarqube.platform.bettrhq.com;

    ssl_certificate /etc/nginx/ssl/live/sonarqube.platform.bettrhq.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/sonarqube.platform.bettrhq.com/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://sonarqubeapp:9000/;
    }
}

